name: Release installers

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build ${{ matrix.name }}
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis --no-sign
          - name: Windows x86
            os: windows-latest
            rust_targets: i686-pc-windows-msvc
            args: --target i686-pc-windows-msvc --bundles nsis --no-sign
          - name: macOS universal
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg

    env:
      RAG_API_BASE_URL: ${{ vars.RAG_API_BASE_URL }}
      RAG_WS_BASE_URL: ${{ vars.RAG_WS_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Validate release version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const packageVersion = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
          const tauriVersion = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version;
          const cargoVersion = fs.readFileSync("src-tauri/Cargo.toml", "utf8").match(/^version = "([^"]+)"/m)?.[1];
          const expectedTag = `v${tauriVersion}`;

          if (!cargoVersion || packageVersion !== tauriVersion || cargoVersion !== tauriVersion) {
            throw new Error(`Version mismatch: package=${packageVersion}, tauri=${tauriVersion}, cargo=${cargoVersion ?? "missing"}`);
          }

          if (process.env.GITHUB_REF_NAME !== expectedTag) {
            throw new Error(`Tag ${process.env.GITHUB_REF_NAME} does not match ${expectedTag}`);
          }
          NODE

      - name: Validate build environment
        shell: bash
        run: |
          node <<'NODE'
          const api = process.env.RAG_API_BASE_URL;
          const ws = process.env.RAG_WS_BASE_URL;
          if (!api || !ws) throw new Error("RAG_API_BASE_URL and RAG_WS_BASE_URL are required");

          const apiUrl = new URL(api);
          if (!['http:', 'https:'].includes(apiUrl.protocol) ||
              apiUrl.pathname.replace(/\/+$/, '') !== '/api/v1' ||
              apiUrl.username || apiUrl.password || apiUrl.search || apiUrl.hash) {
            throw new Error("RAG_API_BASE_URL must be an HTTP(S) URL ending in /api/v1");
          }

          const wsUrl = new URL(ws);
          if (!['ws:', 'wss:'].includes(wsUrl.protocol) ||
              wsUrl.pathname !== '/' || wsUrl.username || wsUrl.password ||
              wsUrl.search || wsUrl.hash) {
            throw new Error("RAG_WS_BASE_URL must be a WS(S) origin without a path");
          }

          console.log(`Validated API origin: ${apiUrl.origin}${apiUrl.pathname}`);
          console.log(`Validated WebSocket origin: ${wsUrl.origin}`);
          NODE

      - name: Test Windows credential store
        if: runner.os == 'Windows'
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml --target "${{ matrix.rust_targets }}" --lib windows_credential_store_round_trip

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: v__VERSION__
          releaseName: RAG Desktop v__VERSION__
          releaseBody: |
            Download the installer for your operating system:

            - Windows x64: `windows-x64`
            - Windows x86: `windows-x86`
            - macOS Intel and Apple Silicon: `macos-universal`
          releaseDraft: true
          prerelease: false
          releaseAssetNamePattern: "rag-desktop-v[version]-[platform]-[arch][setup].[ext]"
          uploadUpdaterJson: false
