name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 NSIS
            os: windows-latest
            args: --target x86_64-pc-windows-msvc --bundles nsis --no-sign
          - name: macOS universal DMG
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg --no-sign

    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_WS_BASE_URL: ${{ vars.VITE_WS_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'x86_64-pc-windows-msvc' }}

      - name: Validate build environment
        shell: bash
        run: |
          test -n "$VITE_API_BASE_URL" || { echo "VITE_API_BASE_URL is not configured"; exit 1; }
          test -n "$VITE_WS_BASE_URL" || { echo "VITE_WS_BASE_URL is not configured"; exit 1; }

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installer
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: .
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "rag-desktop-${{ matrix.os }}-[arch]-[bundle]"
